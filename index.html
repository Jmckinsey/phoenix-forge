<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Handmade knives by Jim McKinsey.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet steel-white gallery. Wide wordmark header, a thin temper-color rule
   (straw → bronze → purple → blue, the colors steel turns as it's tempered),
   a photo-first grid, and one detail page per knife (#knife-name in the address). */
:root {
  --bg: #f5f6f7;
  --surface: #ffffff;
  --fg: #1b1d20;
  --muted: #646a72;
  --line: #dfe2e6;
  --ph: #e8ebee;
  --ph-ink: #c3c8ce;
  --accent: #a4561f;
  --t1: #d9b65c; --t2: #a4561f; --t3: #6c3f78; --t4: #2f5c9c;
  --scrim: rgba(18, 20, 23, .9);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --surface: #1a1d21; --fg: #eceef0; --muted: #9aa1a9; --line: #2a2e34;
  --ph: #1f2327; --ph-ink: #3a4047; --accent: #d98a4e; --scrim: rgba(0,0,0,.92); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1a1d21; --fg: #eceef0; --muted: #9aa1a9; --line: #2a2e34;
  --ph: #1f2327; --ph-ink: #3a4047; --accent: #d98a4e; --scrim: rgba(0,0,0,.92); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Header */
header.site { padding-block: 56px 0; }
.mark { font-family: var(--display); font-stretch: 125%; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; margin: 0; text-wrap: balance; }
.mark a { text-decoration: none; }
.byline { margin: 14px 0 0; color: var(--muted); font-size: 1.05rem; }
.temper { height: 3px; margin-top: 32px; border-radius: 2px;
  background: linear-gradient(90deg, var(--t1), var(--t2) 38%, var(--t3) 68%, var(--t4)); }
nav.top { display: flex; gap: 24px; margin-top: 18px; font-size: .9rem; }
nav.top a { color: var(--muted); text-decoration: none; }
nav.top a:hover { color: var(--fg); }
.preview-note { background: var(--surface); border: 1px dashed var(--line); color: var(--muted); font-size: .85rem; padding: 10px 14px; border-radius: 4px; margin-top: 24px; }

/* Home: filters + grid */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-block: 40px 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 .85rem var(--body); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.count { font: 400 .8rem var(--mono); color: var(--muted); letter-spacing: .04em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 40px 28px; padding-bottom: 72px; }
.card { display: flex; flex-direction: column; gap: 14px; text-decoration: none; min-width: 0; border-radius: 4px; }
.frame { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; overflow: hidden; background: var(--ph); border-radius: 4px; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
.card:hover .frame img { transform: scale(1.03); }
.card:focus-visible { outline-offset: 6px; }
.ph { width: 100%; height: 100%; display: grid; place-items: center; position: relative; }
.ph svg { width: 78%; height: auto; }
.ph span { position: absolute; bottom: 10px; right: 12px; font: 400 .7rem var(--mono); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.meta { display: flex; flex-direction: column; gap: 3px; }
.type { font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.name { font-family: var(--display); font-stretch: 112%; font-weight: 600; font-size: 1.15rem; line-height: 1.25; margin: 0; }
.card:hover .name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.specline { font: 400 .8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

section.about { border-top: 1px solid var(--line); padding-block: 64px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 32px; }
.label { font-family: var(--display); font-stretch: 125%; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 1rem; margin: 6px 0 0; }
.about p { margin: 0 0 1em; max-width: 62ch; font-size: 1.05rem; }
.about p.note { color: var(--muted); font-size: .9rem; }

/* Knife page */
.crumb { display: inline-flex; gap: 6px; margin-top: 36px; font-size: .9rem; color: var(--muted); text-decoration: none; }
.crumb:hover { color: var(--fg); }
.k-top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 48px; padding-block: 24px 56px; align-items: start; }
.k-media { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.k-main { aspect-ratio: 4 / 3; max-width: 100%; background: var(--ph); border-radius: 4px; overflow: hidden; border: 0; padding: 0; cursor: zoom-in; display: block; width: 100%; }
.k-main.empty { cursor: default; }
.k-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.thumbs button { flex: 0 0 76px; height: 57px; padding: 0; border: 2px solid transparent; border-radius: 3px; overflow: hidden; background: var(--ph); cursor: pointer; }
.thumbs button[aria-current="true"] { border-color: var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.k-info { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.k-info h1 { font-family: var(--display); font-stretch: 118%; font-weight: 650; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.08; margin: 0; text-wrap: balance; }
.k-summary { margin: 0; font-size: 1.1rem; color: var(--muted); max-width: 52ch; }
dl.specs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0; margin: 0; border-top: 1px solid var(--line); }
dl.specs dt, dl.specs dd { padding-block: 9px; border-bottom: 1px solid var(--line); }
dl.specs dt { font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-right: 24px; padding-top: 12px; }
dl.specs dd { margin: 0; font-variant-numeric: tabular-nums; }

.k-section { border-top: 1px solid var(--line); padding-block: 48px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 32px; }
.k-section .body > p { margin: 0 0 1em; max-width: 64ch; font-size: 1.05rem; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 4px 12px; }
ol.steps li::before { content: counter(s, decimal-leading-zero); font: 500 .8rem var(--mono); color: var(--accent); padding-top: 3px; grid-row: span 2; }
ol.steps strong { font-weight: 600; }
ol.steps p { margin: 0; color: var(--muted); max-width: 60ch; }
ul.facts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
ul.facts li { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.gallery figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.gallery button { aspect-ratio: 4 / 3; max-width: 100%; width: 100%; padding: 0; border: 0; border-radius: 4px; overflow: hidden; background: var(--ph); cursor: zoom-in; }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery figcaption { font-size: .85rem; color: var(--muted); }
.hint { border: 1px dashed var(--line); border-radius: 4px; padding: 16px 18px; color: var(--muted); font-size: .9rem; max-width: 64ch; }
.hint code { font-family: var(--mono); font-size: .85em; color: var(--fg); }

.pager { border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-block: 32px 64px; }
.pager a { text-decoration: none; display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
.pager a:last-child { text-align: right; }
.pager small { font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pager span { font-family: var(--display); font-stretch: 112%; font-weight: 600; font-size: 1.1rem; }
.pager a:hover span { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

.k-qr { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 18px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px; }
.qr-tile { background: #fff; border-radius: 3px; padding: 8px; width: 132px; height: 132px; }
.qr-tile svg { width: 100%; height: 100%; display: block; }
.qr-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.qr-text strong { font-weight: 600; }
.qr-url { font: 400 .78rem var(--mono); color: var(--muted); overflow-wrap: anywhere; user-select: all; }
.qr-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn { font: 500 .8rem var(--body); padding: 6px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.posts { list-style: none; margin: 0; padding: 0; display: grid; }
.posts li { border-bottom: 1px solid var(--line); }
.posts li:first-child { border-top: 1px solid var(--line); }
.post-row { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 120px; gap: 20px; align-items: center; padding-block: 20px; text-decoration: none; }
.post-row.no-img { grid-template-columns: 9.5rem minmax(0, 1fr); }
.post-row time, .post-head time { font: 400 .8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.post-row h3 { font-family: var(--display); font-stretch: 112%; font-weight: 600; font-size: 1.15rem; line-height: 1.25; margin: 0 0 4px; }
.post-row:hover h3 { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.post-row p { margin: 0; color: var(--muted); font-size: .95rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-row .thumb { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 3px; overflow: hidden; background: var(--ph); }
.post-row .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.more { display: inline-block; margin-top: 18px; font-size: .9rem; color: var(--accent); text-decoration: none; }
.more:hover { text-decoration: underline; }
.page-head { padding-block: 24px 32px; }
.page-head h1, .post-head h1 { font-family: var(--display); font-stretch: 118%; font-weight: 650; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.08; margin: 0; text-wrap: balance; }
.page-head p { margin: 10px 0 0; color: var(--muted); max-width: 60ch; }
article.post { max-width: 720px; padding-block: 24px 48px; }
.post-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.tag { align-self: flex-start; font: 500 .7rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.post-body p { font-size: 1.08rem; line-height: 1.75; margin: 0 0 1.2em; }
.post-figs { display: grid; gap: 24px; margin-block: 8px 28px; }
.post-figs figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.post-figs button { padding: 0; border: 0; border-radius: 4px; overflow: hidden; background: var(--ph); cursor: zoom-in; width: 100%; display: block; }
.post-figs img { width: 100%; height: auto; display: block; }
.post-figs figcaption { font-size: .85rem; color: var(--muted); }
.related { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-top: 12px; }
.related .frame { border-radius: 3px; }
.related .ph span { display: none; }
.related small { font: 500 .7rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; }
.related strong { font-family: var(--display); font-stretch: 112%; font-weight: 600; }
.k-journal { display: flex; flex-direction: column; gap: 6px; }
.k-journal a { text-decoration: none; display: flex; gap: 14px; align-items: baseline; }
.k-journal a:hover span { text-decoration: underline; }
.k-journal time { font: 400 .8rem var(--mono); color: var(--muted); flex: 0 0 auto; }
footer { border-top: 1px solid var(--line); padding-block: 28px 40px; color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

/* Full-size photo viewer */
.viewer { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.viewer img { max-width: 100%; max-height: calc(100% - 80px); object-fit: contain; border-radius: 3px; }
.viewer p { margin: 0; color: #e6e8ea; font-size: .9rem; text-align: center; }
.viewer .vbar { display: flex; gap: 8px; }
.vbtn { font: 500 .85rem var(--body); padding: 8px 14px; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; background: transparent; color: #fff; cursor: pointer; }
.vbtn:hover { border-color: #fff; }

@media (max-width: 800px) {
  header.site { padding-block: 36px 0; }
  section.about, .k-section { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .k-top { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .grid { gap: 32px 20px; }
}
@media (max-width: 640px) {
  .post-row, .post-row.no-img { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .post-row .thumb { display: none; }
}
@media (max-width: 380px) { .k-qr { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .frame img { transition: none; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<header class="site wrap">
  <p class="mark"><a href="#gallery">Phoenix Forge</a></p>
  <p class="byline">Handmade knives by Jim McKinsey</p>
  <div class="temper" aria-hidden="true"></div>
  <nav class="top" aria-label="Sections">
    <a href="#gallery">Gallery</a>
    <a href="#journal">Journal</a>
    <a href="#about">About</a>
  </nav>
  <div class="preview-note" id="previewNote" hidden>Preview layout. Photos and knife details are placeholders until the real pictures are added.</div>
</header>

<main class="wrap" id="home">
  <div class="bar" id="gallery">
    <div class="filters" id="filters" role="group" aria-label="Filter by knife type"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="grid" id="grid"></div>

  <section class="k-section" id="latest" aria-label="From the workshop">
    <h2 class="label">From the workshop</h2>
    <div class="body" id="latestBody"></div>
  </section>

  <section class="about" id="about">
    <h2 class="label">About the maker</h2>
    <div id="aboutBody"></div>
  </section>
</main>

<main class="wrap" id="knife" hidden></main>
<main class="wrap" id="journalPage" hidden></main>
<main class="wrap" id="postPage" hidden></main>

<footer class="wrap">
  <span>© <span id="yr"></span> Phoenix Forge · Jim McKinsey</span>
  <span>Every knife made by hand</span>
</footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img id="vImg" alt="">
  <p id="vCap"></p>
  <div class="vbar">
    <button class="vbtn" id="vPrev" type="button">← Previous</button>
    <button class="vbtn" id="vNext" type="button">Next →</button>
    <button class="vbtn" id="vClose" type="button">Close</button>
  </div>
</div>

<script>
/* Phoenix Forge site script.
   Content lives in data/site.json, data/knives.json and data/posts.json.
   Jim edits those through the editor at /admin. No need to touch this file. */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slugify = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const RESERVED = new Set(["gallery", "about", "home", "knife", "journal", "latest", "settings", "sidebar", "customize", "upgrade", "downloads"]);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SPEC_LABELS = { overall: "Overall length", blade: "Blade length", steel: "Steel", hardness: "Hardness",
  grind: "Grind", finish: "Finish", handle: "Handle", guard: "Guard / bolster", sheath: "Sheath", weight: "Weight", year: "Made" };

let SITE = { showHints: true, siteUrl: "", about: "" }, KNIVES = [], POST_LIST = [];

const hint = (text) => SITE.showHints ? `<div class="hint">${text}</div>` : "";
const paras = (s) => (Array.isArray(s) ? s : String(s || "").split(/\n\s*\n/)).map(t => String(t).trim()).filter(Boolean);
const normPhotos = (list) => (list || []).map(p => typeof p === "string" ? { src: p, caption: "" } : { src: p.src || p.image || "", caption: p.caption || "" }).filter(p => p.src);

/* Placeholder knife outline used until real photos are added. */
const SHAPES = { chef: [215, 46], hunter: [150, 38], bowie: [200, 42], nakiri: [185, 52], paring: [100, 26], skinner: [125, 44] };
function silhouette(shape) {
  const [L, H] = SHAPES[shape] || SHAPES.chef;
  const total = 95 + L, x0 = (400 - total) / 2, hx = x0 + 95, tip = hx + L, top = 140 - H / 2, bot = top + H;
  let blade;
  if (shape === "nakiri") blade = `M${hx} ${top} L${tip} ${top} L${tip} ${bot - 4} Q${tip} ${bot} ${tip - 6} ${bot} L${hx} ${bot} Z`;
  else if (shape === "bowie") blade = `M${hx} ${top} L${tip - 60} ${top} L${tip} ${top + H * .45} Q${tip - 70} ${bot} ${hx} ${bot} Z`;
  else if (shape === "skinner") blade = `M${hx} ${top + 6} Q${tip - 20} ${top - 6} ${tip} ${top + 10} Q${tip - 30} ${bot + 4} ${hx} ${bot} Z`;
  else blade = `M${hx} ${top} L${tip - L * .25} ${top} Q${tip} ${top + 2} ${tip} ${top + 8} Q${tip - L * .35} ${bot} ${hx} ${bot} Z`;
  const hy = top + H * .2, hh = Math.max(20, H * .6);
  return `<svg viewBox="0 0 400 280" aria-hidden="true" fill="var(--ph-ink)">
    <path d="${blade}"/><rect x="${hx - 8}" y="${hy - 4}" width="10" height="${hh + 8}" rx="2"/>
    <rect x="${x0}" y="${hy}" width="${95 - 6}" height="${hh}" rx="${hh / 2.4}"/></svg>`;
}
const placeholder = (k) => `<div class="ph">${silhouette(k.shape)}<span>Photo coming soon</span></div>`;
const specLine = (k) => [k.specs.blade, k.specs.steel, k.specs.handle].filter(Boolean).join(" · ") || "Details coming soon";

/* ---------- Load content ---------- */
async function loadJSON(path) {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error(path);
  return r.json();
}
function prepare(site, knives, posts) {
  SITE = Object.assign(SITE, site || {});
  const used = new Set();
  KNIVES = (knives.knives || []).filter(k => k && k.name).map(k => {
    let s = slugify(k.name) || "knife"; if (RESERVED.has(s)) s += "-knife";
    let u = s, n = 2; while (used.has(u)) u = `${s}-${n++}`; used.add(u);
    const specs = {}; Object.keys(SPEC_LABELS).forEach(f => specs[f] = (k.specs && k.specs[f]) || "");
    return { ...k, slug: u, photos: normPhotos(k.photos), specs, story: paras(k.story),
      build: (k.build || []).filter(b => b && (b.step || b.text)),
      details: (k.details || []).map(d => typeof d === "string" ? d : d && d.text).filter(Boolean) };
  });
  POST_LIST = (posts.posts || []).filter(x => x && x.title && (SITE.showHints || !x.example)).map(x => {
    const [y, m, d] = String(x.date || "").slice(0, 10).split("-").map(Number);
    return { ...x, photos: normPhotos(x.photos), paras: paras(x.body),
      when: y ? new Date(y, (m || 1) - 1, d || 1) : new Date(0),
      nice: y ? `${MONTHS[(m || 1) - 1]} ${d || 1}, ${y}` : "",
      slug: "journal-" + (slugify(`${String(x.date || "").slice(0, 10)} ${x.title}`) || "post"),
      knifeObj: KNIVES.find(k => x.knife && (k.name === x.knife || k.slug === x.knife)) };
  }).sort((a, b) => b.when - a.when);
}

/* ---------- Home ---------- */
let filter = "All";
function renderHome() {
  const types = ["All", ...new Set(KNIVES.map(k => k.type).filter(Boolean))];
  $("filters").innerHTML = types.map(t =>
    `<button class="chip" type="button" aria-pressed="${t === filter}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $("filters").hidden = types.length < 3;
  const list = KNIVES.filter(k => filter === "All" || k.type === filter);
  $("count").textContent = `${list.length} ${list.length === 1 ? "knife" : "knives"}`;
  $("grid").innerHTML = list.length ? list.map(k => `
    <a class="card" href="#${k.slug}">
      <div class="frame">${k.photos.length ? `<img src="${esc(k.photos[0].src)}" alt="${esc(k.name)}" loading="lazy">` : placeholder(k)}</div>
      <div class="meta">
        ${k.type ? `<span class="type">${esc(k.type)}</span>` : ""}
        <h2 class="name">${esc(k.name)}</h2>
        <span class="specline">${esc(specLine(k))}</span>
      </div>
    </a>`).join("") : `<p class="hint">No knives yet. Add the first one in the editor.</p>`;
}
$("filters").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { filter = b.dataset.t; renderHome(); } });

function renderAbout() {
  $("aboutBody").innerHTML = paras(SITE.about).map(t => `<p>${esc(t)}</p>`).join("")
    + (SITE.showHints ? `<p class="note">Add a line or two in Jim's words: how he got into knifemaking, and the steels and handle materials he likes to work with.</p>` : "");
}

/* ---------- Knife page ---------- */
let cur = null, photoIdx = 0;
function section(title, body) { return body ? `<section class="k-section"><h2 class="label">${title}</h2><div class="body">${body}</div></section>` : ""; }

function renderKnife(k) {
  cur = k; photoIdx = 0;
  const i = KNIVES.indexOf(k), prev = KNIVES[(i - 1 + KNIVES.length) % KNIVES.length], next = KNIVES[(i + 1) % KNIVES.length];
  const specRows = Object.entries(SPEC_LABELS).filter(([f]) => k.specs[f]);
  const story = k.story.length ? k.story.map(p => `<p>${esc(p)}</p>`).join("")
    : hint("Tell the story of this knife: who it was made for, what inspired the design, anything that went wrong or surprised you.");
  const build = k.build.length ? `<ol class="steps">${k.build.map(b => `<li><strong>${esc(b.step)}</strong><p>${esc(b.text)}</p></li>`).join("")}</ol>`
    : hint("Walk through how it was made, in order: forging or stock removal, heat treat, grinding, handle work, finishing.");
  const details = k.details.length ? `<ul class="facts">${k.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul>`
    : hint("Short facts worth noticing: where the handle wood came from, a hamon or Damascus pattern, a maker's mark, how many hours it took.");
  const gallery = k.photos.length > 1 ? `<div class="gallery">${k.photos.map((p, n) => `
      <figure><button type="button" data-v="${n}" aria-label="Open photo ${n + 1}"><img src="${esc(p.src)}" alt="${esc(p.caption || k.name)}" loading="lazy"></button>
      ${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ""}</figure>`).join("")}</div>`
    : hint("Every photo added to this knife shows up here, with an optional caption for close-ups of the handle, spine, edge or sheath.");
  const related = POST_LIST.filter(x => x.knifeObj === k);

  $("knife").innerHTML = `
    <a class="crumb" href="#gallery">← All knives</a>
    <div class="k-top">
      <div class="k-media">
        <button class="k-main${k.photos.length ? "" : " empty"}" id="kMain" type="button" ${k.photos.length ? 'aria-label="View full size"' : 'tabindex="-1" aria-hidden="true"'}></button>
        <div class="thumbs" id="kThumbs"></div>
      </div>
      <div class="k-info">
        ${k.type ? `<span class="type">${esc(k.type)}</span>` : ""}
        <h1>${esc(k.name)}</h1>
        ${k.summary ? `<p class="k-summary">${esc(k.summary)}</p>` : hint("Add a one- or two-sentence summary of this knife.")}
        ${specRows.length ? `<dl class="specs">${specRows.map(([f, l]) => `<dt>${l}</dt><dd>${esc(k.specs[f])}</dd>`).join("")}</dl>`
          : hint("Fill in the specs: overall and blade length, steel, hardness, grind, finish, handle, guard, sheath, weight, year made.")}
        <div class="k-qr">
          <div class="qr-tile" id="qrTile" role="img" aria-label="QR code for this page"></div>
          <div class="qr-text">
            <strong>Scan to open this page</strong>
            <span class="qr-url" id="qrUrl"></span>
            ${SITE.showHints && !SITE.siteUrl ? `<span class="qr-url">In a preview the code points at the preview address. On the live site it uses the real web address automatically.</span>` : ""}
            <div class="qr-actions">
              <button class="btn" type="button" id="qrSave">Download QR</button>
              <button class="btn" type="button" id="qrCopy">Copy link</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    ${section("The story", story)}
    ${section("How it was made", build)}
    ${section("Details worth noticing", details)}
    ${section("Photos", gallery)}
    ${section("From the journal", related.length ? `<div class="k-journal">${related.map(x => `<a href="#${x.slug}"><time datetime="${esc(x.date)}">${esc(x.nice)}</time><span>${esc(x.title)}</span></a>`).join("")}</div>` : "")}
    ${KNIVES.length > 1 ? `<nav class="pager" aria-label="More knives">
      <a href="#${prev.slug}"><small>← Previous</small><span>${esc(prev.name)}</span></a>
      <a href="#${next.slug}"><small>Next →</small><span>${esc(next.name)}</span></a>
    </nav>` : ""}`;
  showMain();
  renderQR(k);
}
function showMain() {
  const k = cur;
  $("kMain").innerHTML = k.photos.length ? `<img src="${esc(k.photos[photoIdx].src)}" alt="${esc(k.photos[photoIdx].caption || k.name)}">` : placeholder(k);
  $("kThumbs").innerHTML = k.photos.length > 1 ? k.photos.map((p, n) =>
    `<button type="button" data-p="${n}" aria-label="Show photo ${n + 1}" aria-current="${n === photoIdx}"><img src="${esc(p.src)}" alt=""></button>`).join("") : "";
  $("kThumbs").hidden = k.photos.length < 2;
}
$("knife").addEventListener("click", e => {
  const t = e.target.closest("[data-p]"); if (t) { photoIdx = +t.dataset.p; showMain(); return; }
  const v = e.target.closest("[data-v]"); if (v) { openViewer(+v.dataset.v); return; }
  if (e.target.closest("#kMain") && cur.photos.length) openViewer(photoIdx);
});

/* ---------- QR codes ---------- */
function pageUrl(k) {
  const base = SITE.siteUrl || (location.origin + location.pathname);
  return base.replace(/#.*$/, "") + "#" + k.slug;
}
function makeQR(text) { const q = qrcode(0, "M"); q.addData(text); q.make(); return q; }
function qrSvg(q) {
  const n = q.getModuleCount(); let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true"><path d="${d}" fill="#000"/></svg>`;
}
function renderQR(k) {
  const url = pageUrl(k), q = makeQR(url);
  $("qrTile").innerHTML = qrSvg(q);
  $("qrUrl").textContent = url;
  $("qrSave").onclick = () => {
    const n = q.getModuleCount(), quiet = 4, scale = 20, size = (n + quiet * 2) * scale, labelH = 90;
    const cv = document.createElement("canvas"); cv.width = size; cv.height = size + labelH;
    const g = cv.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = "#000";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
    g.textAlign = "center"; g.font = "600 34px Arial, sans-serif";
    g.fillText(`Phoenix Forge · ${k.name}`, size / 2, size + 30);
    const a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = `qr-${k.slug}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  $("qrCopy").onclick = () => {
    const done = () => { $("qrCopy").textContent = "Copied"; setTimeout(() => { if ($("qrCopy")) $("qrCopy").textContent = "Copy link"; }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("qrUrl")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(url).then(done, fallback); } catch { fallback(); }
  };
}

/* ---------- Journal ---------- */
function postRow(x) {
  const img = x.photos[0] || (x.knifeObj && x.knifeObj.photos[0]);
  return `<li><a class="post-row${img ? "" : " no-img"}" href="#${x.slug}">
    <time datetime="${esc(x.date)}">${esc(x.nice)}</time>
    <div><h3>${esc(x.title)}</h3><p>${esc(x.paras[0] || "")}</p></div>
    ${img ? `<div class="thumb"><img src="${esc(img.src)}" alt="" loading="lazy"></div>` : ""}
  </a></li>`;
}
function renderLatest() {
  $("latest").hidden = !POST_LIST.length;
  $("latestBody").innerHTML = `<ul class="posts">${POST_LIST.slice(0, 3).map(postRow).join("")}</ul>
    <a class="more" href="#journal">All journal entries →</a>`;
}
function renderJournal() {
  $("journalPage").innerHTML = `
    <a class="crumb" href="#gallery">← Gallery</a>
    <div class="page-head"><h1>Journal</h1><p>Notes from the shop: what's on the bench, what's finished, and what's next.</p></div>
    ${POST_LIST.length ? `<ul class="posts">${POST_LIST.map(postRow).join("")}</ul>` : `<p class="hint">No entries yet.</p>`}
    <div style="height:64px"></div>`;
}
function figure(x, n) {
  const ph = x.photos[n];
  return `<figure><button type="button" data-v="${n}" aria-label="Open photo ${n + 1}"><img src="${esc(ph.src)}" alt="${esc(ph.caption || x.title)}" loading="lazy"></button>
    ${ph.caption ? `<figcaption>${esc(ph.caption)}</figcaption>` : ""}</figure>`;
}
function renderPost(x) {
  const i = POST_LIST.indexOf(x), newer = POST_LIST[i - 1], older = POST_LIST[i + 1], k = x.knifeObj;
  $("postPage").innerHTML = `
    <a class="crumb" href="#journal">← Journal</a>
    <article class="post">
      <header class="post-head">
        ${x.tag ? `<span class="tag">${esc(x.tag)}</span>` : ""}
        <h1>${esc(x.title)}</h1>
        <time datetime="${esc(x.date)}">${esc(x.nice)}</time>
      </header>
      ${x.photos[0] ? `<div class="post-figs">${figure(x, 0)}</div>` : ""}
      <div class="post-body">${x.paras.map(t => `<p>${esc(t)}</p>`).join("")}</div>
      ${x.photos.length > 1 ? `<div class="post-figs">${x.photos.slice(1).map((_, n) => figure(x, n + 1)).join("")}</div>` : ""}
      ${k ? `<a class="related" href="#${k.slug}">
        <div class="frame">${k.photos.length ? `<img src="${esc(k.photos[0].src)}" alt="">` : placeholder(k)}</div>
        <div><small>About this knife</small><strong>${esc(k.name)}</strong></div></a>` : ""}
    </article>
    ${POST_LIST.length > 1 ? `<nav class="pager" aria-label="More entries">
      ${older ? `<a href="#${older.slug}"><small>← Older</small><span>${esc(older.title)}</span></a>` : "<span></span>"}
      ${newer ? `<a href="#${newer.slug}"><small>Newer →</small><span>${esc(newer.title)}</span></a>` : "<span></span>"}
    </nav>` : ""}`;
  cur = { name: x.title, photos: x.photos };
}
$("postPage").addEventListener("click", e => { const v = e.target.closest("[data-v]"); if (v) openViewer(+v.dataset.v); });

/* ---------- Full-size viewer ---------- */
let vIdx = 0, lastFocus = null;
function drawViewer() {
  const p = cur.photos[vIdx];
  $("vImg").src = p.src; $("vImg").alt = p.caption || cur.name;
  $("vCap").textContent = p.caption || `${cur.name} · ${vIdx + 1} of ${cur.photos.length}`;
  $("vPrev").hidden = $("vNext").hidden = cur.photos.length < 2;
}
function openViewer(n) { vIdx = n; drawViewer(); lastFocus = document.activeElement; $("viewer").hidden = false; document.body.style.overflow = "hidden"; $("vClose").focus(); }
function closeViewer() { $("viewer").hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
const step = (d) => { vIdx = (vIdx + d + cur.photos.length) % cur.photos.length; drawViewer(); };
$("vPrev").addEventListener("click", () => step(-1));
$("vNext").addEventListener("click", () => step(1));
$("vClose").addEventListener("click", closeViewer);
$("viewer").addEventListener("click", e => { if (e.target === $("viewer")) closeViewer(); });
document.addEventListener("keydown", e => {
  if ($("viewer").hidden) return;
  if (e.key === "Escape") closeViewer(); else if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
});

/* ---------- Routing: #knife-name, #journal, #journal-... ---------- */
const VIEWS = ["home", "knife", "journalPage", "postPage"];
function show(view) { VIEWS.forEach(v => $(v).hidden = v !== view); }
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!$("viewer").hidden) closeViewer();
  const k = KNIVES.find(x => x.slug === h), post = POST_LIST.find(x => x.slug === h);
  if (k) { show("knife"); renderKnife(k); document.title = `${k.name} · Phoenix Forge`; window.scrollTo(0, 0); }
  else if (post) { show("postPage"); renderPost(post); document.title = `${post.title} · Phoenix Forge`; window.scrollTo(0, 0); }
  else if (h === "journal") { show("journalPage"); renderJournal(); document.title = "Journal · Phoenix Forge"; window.scrollTo(0, 0); }
  else {
    const wasAway = $("home").hidden;
    show("home"); document.title = "Phoenix Forge";
    const target = h && document.getElementById(h);
    if (target) target.scrollIntoView(); else if (wasAway) window.scrollTo(0, 0);
  }
}
window.addEventListener("hashchange", route);

$("yr").textContent = new Date().getFullYear();
(async () => {
  try {
    const [site, knives, posts] = await Promise.all([loadJSON("data/site.json"), loadJSON("data/knives.json"), loadJSON("data/posts.json")]);
    prepare(site, knives, posts);
  } catch (err) {
    $("grid").innerHTML = `<p class="hint">The knife list couldn't load. Open the site through its web address (or a local web server), not by double-clicking index.html.</p>`;
    $("count").textContent = "";
    return;
  }
  $("previewNote").hidden = !SITE.showHints;
  renderAbout(); renderHome(); renderLatest(); route();
})();
</script>
